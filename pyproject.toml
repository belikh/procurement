[project]
name = "procurement-mcp"
version = "0.1.0"
description = "Federated procurement MCP server — Chinese marketplaces + Australian sources via integration-only APIs"
readme = "README.rst"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "procurement", email = "io+agent@jupiter.au" }]
dependencies = [
    "mcp[cli]>=2.3.0,<3",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "asyncpg>=0.30.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pyright>=1.1.380",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[project.scripts]
procurement-mcp = "procurement.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py", "procurement"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Field descriptions and SQL read better on one line.
"procurement/models.py" = ["E501"]
"procurement/tools.py" = ["E501"]
"procurement/db.py" = ["E501"]
"procurement/lanes/grocery.py" = ["E501"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingImports = true
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls real upstream APIs and spends credits; run with -m live"]
